name: Build and Publish Debug APK

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Verify Java environment
        run: |
          java -version
          echo "JAVA_HOME=$JAVA_HOME"
          JAVA_VER=$(java -version 2>&1 | head -n 1 | awk -F '"' '{print $2}' | cut -d'.' -f1)
          if [ -z "$JAVA_VER" ]; then
            echo "::error::Could not detect active Java version"
            exit 1
          fi
          echo "Detected Java major version: $JAVA_VER"
          if [ "$JAVA_VER" -lt 17 ]; then
            echo "::error::Active Java major version must be 17 or newer. Found: $JAVA_VER"
            exit 1
          fi

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.3.1'

      - name: Create temporary debug keystore
        run: |
          if [ -f "./debug.keystore" ]; then
            echo "debug.keystore already exists."
          else
            echo "Generating temporary debug keystore..."
            keytool -genkey -v \
              -keystore ./debug.keystore \
              -storepass android \
              -alias androiddebugkey \
              -keypass android \
              -keyalg RSA \
              -keysize 2048 \
              -validity 10000 \
              -dname "CN=Android Debug,O=Android,C=US"
          fi
          if [ ! -f "./debug.keystore" ]; then
            echo "::error::Temporary debug keystore was not created."
            exit 1
          fi
          echo "Debug keystore confirmed."

      - name: Build debug APK
        run: gradle :app:assembleDebug --stacktrace --no-daemon

      - name: Verify APK
        run: |
          EXPECTED_APK="app/build/outputs/apk/debug/app-debug.apk"
          if [ ! -f "$EXPECTED_APK" ]; then
            echo "::error::Expected APK not found at $EXPECTED_APK"
            echo "Searching only inside app/build/outputs/apk:"
            find app/build/outputs/apk -maxdepth 3 -type f -name "*.apk" || true
            exit 1
          fi
          if [ ! -s "$EXPECTED_APK" ]; then
            echo "::error::APK file is empty"
            exit 1
          fi
          case "$EXPECTED_APK" in
            *.apk) ;;
            *) echo "::error::File does not have .apk extension"; exit 1 ;;
          esac
          echo "Verified APK successfully: $EXPECTED_APK"

      - name: Upload debug APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

      - name: Prepare APK release asset
        id: prepare_asset
        run: |
          TEMP_RELEASE_DIR=$(mktemp -d -t apk-release-XXXXXX)
          REPO_NAME="${GITHUB_REPOSITORY#*/}"
          SAFE_REPO_NAME=$(echo "$REPO_NAME" | tr -c 'a-zA-Z0-9._-' '-' | sed 's/--*/-/g' | sed 's/^-//' | sed 's/-$//')
          if [ -z "$SAFE_REPO_NAME" ]; then
            SAFE_REPO_NAME="android-app"
          fi
          ASSET_FILENAME="${SAFE_REPO_NAME}-debug-build-${GITHUB_RUN_NUMBER}.apk"
          DEST_PATH="${TEMP_RELEASE_DIR}/${ASSET_FILENAME}"
          cp "app/build/outputs/apk/debug/app-debug.apk" "$DEST_PATH"
          if [ ! -f "$DEST_PATH" ] || [ ! -s "$DEST_PATH" ]; then
            echo "::error::Failed to prepare non-empty release asset at $DEST_PATH"
            exit 1
          fi
          echo "Prepared release asset: $DEST_PATH"
          echo "asset_path=$DEST_PATH" >> "$GITHUB_OUTPUT"
          echo "asset_filename=$ASSET_FILENAME" >> "$GITHUB_OUTPUT"

      - name: Publish APK to GitHub Releases
        id: publish_release
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh --version
          ASSET_PATH="${{ steps.prepare_asset.outputs.asset_path }}"
          if [ -z "$ASSET_PATH" ] || [ ! -f "$ASSET_PATH" ] || [ ! -s "$ASSET_PATH" ]; then
            echo "::error::Release asset does not exist or is empty: $ASSET_PATH"
            exit 1
          fi
          case "$ASSET_PATH" in
            *.apk) ;;
            *) echo "::error::Release asset is not an APK file: $ASSET_PATH"; exit 1 ;;
          esac

          RELEASE_TAG="debug-apk-build-${GITHUB_RUN_NUMBER}-${GITHUB_RUN_ATTEMPT}"
          RELEASE_TITLE="Debug APK Build #${GITHUB_RUN_NUMBER}"

          NOTES_FILE=$(mktemp)
          cat <<EOF > "$NOTES_FILE"
          ### Debug APK Build Details

          - **Build Type**: Automatically generated debug APK
          - **Builder**: GitHub Actions
          - **Run Number**: ${GITHUB_RUN_NUMBER}
          - **Run Attempt**: ${GITHUB_RUN_ATTEMPT}
          - **Source Commit**: ${GITHUB_SHA}
          - **Purpose**: Intended for testing only
          - **Note**: This is not a Play Store production release. The APK is signed only with a temporary debug keystore.
          EOF

          gh release create "$RELEASE_TAG" \
            "$ASSET_PATH" \
            --title "$RELEASE_TITLE" \
            --notes-file "$NOTES_FILE" \
            --target "$GITHUB_SHA" \
            --latest

          rm -f "$NOTES_FILE"
          echo "release_tag=$RELEASE_TAG" >> "$GITHUB_OUTPUT"
          echo "release_title=$RELEASE_TITLE" >> "$GITHUB_OUTPUT"

      - name: Report APK download result
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          RELEASE_OUTCOME="${{ steps.publish_release.outcome }}"
          ASSET_FILENAME="${{ steps.prepare_asset.outputs.asset_filename }}"

          if [ "$RELEASE_OUTCOME" = "success" ]; then
            RELEASE_TAG="${{ steps.publish_release.outputs.release_tag }}"
            RELEASE_TITLE="${{ steps.publish_release.outputs.release_title }}"
            
            echo "Confirming release view..."
            gh release view "$RELEASE_TAG" || true

            RELEASE_URL="https://github.com/${GITHUB_REPOSITORY}/releases/tag/${RELEASE_TAG}"
            echo "=== GitHub Release Published Successfully ==="
            echo "Release Tag: $RELEASE_TAG"
            echo "Release Title: $RELEASE_TITLE"
            echo "Release URL: $RELEASE_URL"
            echo "Asset Filename: $ASSET_FILENAME"

            {
              echo "### 🚀 Debug APK Published to GitHub Releases"
              echo ""
              echo "- **Release Tag:** \`$RELEASE_TAG\`"
              echo "- **Release Title:** $RELEASE_TITLE"
              echo "- **Direct Download URL:** [$RELEASE_URL]($RELEASE_URL)"
              echo "- **Asset Filename:** \`$ASSET_FILENAME\`"
              echo ""
              echo "📱 You can download the APK directly to your phone from the release **Assets** section."
              echo ""
              echo "📦 The standard GitHub Actions artifact (\`app-debug-apk\`) is also available as a backup under this workflow run's Summary page."
            } >> "$GITHUB_STEP_SUMMARY"
          else
            echo "::warning::GitHub Release publishing was not completed or encountered an issue."
            echo "The debug APK build succeeded and the GitHub Actions artifact 'app-debug-apk' remains available for download."

            {
              echo "### ⚠️ Debug APK Build Succeeded (Release Publishing Notice)"
              echo ""
              echo "The debug APK was built successfully, but the automated GitHub Release creation step encountered an issue or was skipped."
              echo ""
              echo "📦 **Backup Artifact Available:** You can download the verified APK (\`app-debug-apk\`) from the **Artifacts** section on this GitHub Actions run summary page."
            } >> "$GITHUB_STEP_SUMMARY"
          fi
